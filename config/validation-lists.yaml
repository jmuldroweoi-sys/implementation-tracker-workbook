# Workbook validation lists. Every list cites its source: a pinned R1 file under
# schemas/r1/ (synchronized from R1 commit 9acd25a), or an R3 schema for the few
# workbook-only lists. R3 defines no independent status list.
# tools/build_workbook.py reads each list from its source, not from this file;
# tools/validate.py fails if a list here drifts from its source.
pinned_r1_commit: 9acd25a4673facf2b3cca2467142987548949ce3
