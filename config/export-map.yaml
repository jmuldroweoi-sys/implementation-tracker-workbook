# Export map. Each export is generated from a workbook table after recalculation
# (tools/build_workbook.py --exports); no export is maintained by hand.
# Columns are the authoritative field names, in the authoritative order. Workbook-only
# helper columns (checks, due states, bands, event evidence) never enter these files.
# For R1 entities the column list equals the R1 schema's CSV contract, so an export of
# unchanged synthetic data is byte-identical to the pinned R1 file.
exports:
- table: tblProjects
  file: exports/csv/projects.csv
  columns:
  - project_id
  - name
  - customer_reference
  - customer_label
  - current_phase_id
  - project_status
  - org_stage
  - complexity_profile_id
  - service_profile_id
  - segment_profile_id
  - project_owner_role_id
  - target_launch_date
  - actual_launch_date
  - external_reference
  - created_at
  - updated_at
  - schema_version
  authoritative_source: R1 schemas/project.schema.json
  downstream_consumers:
  - implementation-capacity-and-org-design
  - analytics
- table: tblPhases
  file: exports/csv/phases.csv
  columns:
  - phase_id
  - project_id
  - lifecycle_phase_key
  - status
  - entered_at
  - exited_at
  - owner_role_id
  - gate_id
  - schema_version
  authoritative_source: R1 schemas/phase.schema.json
  downstream_consumers:
  - implementation-capacity-and-org-design
  - analytics
- table: tblMilestones
  file: exports/csv/milestones.csv
  columns:
