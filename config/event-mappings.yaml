# Event mappings: which workbook change corresponds to which registered R1 event.
# This does not mean the workbook appends events. A macro-free spreadsheet cannot do that
# reliably. A person appends or imports the event row; the event_evidence columns flag
# material changes that still have no row. Event types, subject types, and payload field
# names come from the pinned R1 event catalog (schemas/r1/standard/event-catalog.yaml).
# Every event row uses source_repo implementation-operating-system: these are R1 events,
# recorded in R1's spreadsheet implementation. R3 produces no events of its own.
pinned_r1_commit: 9acd25a4673facf2b3cca2467142987548949ce3
mappings:
- source_table: tblProjects
  trigger_condition: a project row is added
  event_type: project.created
  event_subject: tblProjects.project_id
  subject_type: project
  actor: the named person (PER-) who made the change; for request.escalated and readiness.scored, the R1 rule (RUL-) as system actor
  required_payload_source_fields:
    status: tblProjects.project_status
  optional_payload_source_fields:
    target_launch_date: tblProjects.target_launch_date
- source_table: tblProjects
  trigger_condition: project_status changes
  event_type: project.status_changed
  event_subject: tblProjects.project_id
  subject_type: project
  actor: the named person (PER-) who made the change; for request.escalated and readiness.scored, the R1 rule (RUL-) as system actor
  required_payload_source_fields:
    from_status: previous tblProjects.project_status
    to_status: tblProjects.project_status
  optional_payload_source_fields: {}
- source_table: tblPhases
