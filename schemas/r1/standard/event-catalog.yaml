standard_version: 1.0.0
description: The complete event catalog for standard 1.0.0. Every event emitted by any of the six repositories must appear here exactly once, with exactly one producer. Payload field lists name fields only;
  the producing repository defines their full schema using the field conventions.
authoritative_effect_values:
  records_authoritative_transition: The event records a transition that the producing repository has already made authoritatively. The event itself grants no authority.
  records_proposal: The event records a proposal. It changes no authoritative record until a named human approves it through an approval record.
  informational: The event records an occurrence for information or workload accounting. It changes no authoritative record.
events:
- event_type: project.created
  version: 1
  producer_repo: implementation-operating-system
  consumer_repos: [implementation-capacity-and-org-design, implementation-tracker-workbook, implementation-ai-agent-framework]
  subject_type: project
  required_payload_fields: [status]
  optional_payload_fields: [profile_id, scenario_id, target_launch_date]
  description: A project record was created in the operating system.
  authoritative_effect: records_authoritative_transition
- event_type: project.status_changed
